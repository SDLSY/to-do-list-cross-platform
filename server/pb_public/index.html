<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>⚡ RETRO TASK // 跨端实时待办看板</title>
  <style>
    /* ============================================================
       复古新野蛮主义 (NEO-BRUTALISM) 极客设计系统
       ============================================================ */
    :root {
      --bg: #fffdfa;
      --card-bg: #ffffff;
      --border: #000000;
      --shadow: 4px 4px 0px #000000;
      --shadow-hover: 6px 6px 0px #000000;
      --shadow-active: 1px 1px 0px #000000;
      --shadow-sm: 2px 2px 0px #000000;

      /* Neo-Brutalism 撞色调色板 */
      --c-yellow: #fef08a;
      --c-yellow-dark: #facc15;
      --c-blue: #bae6fd;
      --c-blue-dark: #38bdf8;
      --c-green: #bbf7d0;
      --c-green-dark: #4ade80;
      --c-pink: #fbcfe8;
      --c-pink-dark: #f472b6;
      --c-purple: #e9d5ff;
      --c-orange: #fed7aa;
      --c-danger: #f87171;
      --c-text: #18181b;
      --c-muted: #71717a;

      --font-main: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-main);
      background-color: var(--bg);
      background-image: radial-gradient(#000000 0.75px, transparent 0.75px);
      background-size: 20px 20px;
      color: var(--c-text);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    /* 顶部导航 Header */
    header {
      background: #ffffff;
      border-bottom: 3px solid var(--border);
      padding: 10px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-shrink: 0;
      box-shadow: 0 4px 0 rgba(0,0,0,0.06);
      z-index: 20;
    }

    .header-brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--c-yellow);
      border: 2px solid var(--border);
      box-shadow: var(--shadow-sm);
      padding: 5px 12px;
      font-weight: 900;
      font-size: 16px;
      letter-spacing: -0.5px;
      text-transform: uppercase;
      transform: rotate(-1deg);
      user-select: none;
    }

    /* 实时同步状态指示胶囊 (带动态心跳) */
    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      background: #ffffff;
      border: 2px solid var(--border);
      box-shadow: var(--shadow-sm);
      padding: 4px 10px;
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 800;
      cursor: pointer;
      transition: all 0.15s;
    }
    .status-pill:hover {
      box-shadow: var(--shadow);
      transform: translate(-1px, -1px);
    }
    .status-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #22c55e;
      border: 1.5px solid var(--border);
      transition: background 0.3s;
    }
    .status-dot.connecting {
      background: #facc15;
      animation: blink 0.8s infinite;
    }
    .status-dot.error {
      background: #ef4444;
      animation: none;
    }
    .status-dot.connected {
      background: #22c55e;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(0.85); opacity: 0.5; }
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.2; }
    }

    /* 顶部中央：生产力进度仪表盘 */
    .dashboard-panel {
      display: flex;
      align-items: center;
      gap: 16px;
      background: #ffffff;
      border: 2px solid var(--border);
      box-shadow: var(--shadow-sm);
      padding: 6px 16px;
      border-radius: 8px;
    }

    .stat-chip {
      display: flex;
      align-items: baseline;
      gap: 5px;
      font-size: 12px;
      font-weight: 700;
    }
    .stat-chip .num {
      font-family: var(--font-mono);
      font-size: 16px;
      font-weight: 900;
    }

    .progress-bar-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 160px;
    }
    .progress-track {
      flex: 1;
      height: 14px;
      background: #f4f4f5;
      border: 2px solid var(--border);
      border-radius: 4px;
      overflow: hidden;
      position: relative;
    }
    .progress-fill {
      height: 100%;
      background: var(--c-green-dark);
      width: 0%;
      transition: width 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
      border-right: 2px solid var(--border);
    }
    .progress-pct {
      font-family: var(--font-mono);
      font-size: 12px;
      font-weight: 900;
      min-width: 38px;
    }

    /* Header 右侧控制区 */
    .header-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .search-box {
      position: relative;
      display: flex;
      align-items: center;
    }
    .search-box input {
      padding: 7px 12px 7px 32px;
      font-size: 13px;
      font-weight: 600;
      border: 2px solid var(--border);
      box-shadow: var(--shadow-sm);
      outline: none;
      background: #ffffff;
      width: 170px;
      transition: width 0.2s, box-shadow 0.2s;
    }
    .search-box input:focus {
      width: 210px;
      box-shadow: var(--shadow);
    }
    .search-box .icon {
      position: absolute;
      left: 10px;
      font-size: 13px;
      pointer-events: none;
    }

    .view-toggle-btn {
      display: inline-flex;
      background: #ffffff;
      border: 2px solid var(--border);
      box-shadow: var(--shadow-sm);
      border-radius: 6px;
      overflow: hidden;
    }
    .view-opt {
      padding: 6px 12px;
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
      border: none;
      background: transparent;
      transition: all 0.15s;
    }
    .view-opt.active {
      background: var(--c-yellow);
      color: #000;
      font-weight: 900;
    }
    .view-opt:not(.active):hover {
      background: #f4f4f5;
    }

    /* 粗暴按钮 (Brutal Button) */
    .btn-brutal {
      background: #ffffff;
      border: 2px solid var(--border);
      box-shadow: var(--shadow);
      padding: 7px 16px;
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
      transition: transform 0.1s, box-shadow 0.1s;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      user-select: none;
    }
    .btn-brutal:hover {
      transform: translate(-2px, -2px);
      box-shadow: var(--shadow-hover);
    }
    .btn-brutal:active {
      transform: translate(2px, 2px);
      box-shadow: var(--shadow-active);
    }
    .btn-primary-brutal {
      background: var(--c-yellow);
      color: #000;
    }

    /* 主内容区：100% 自适应撑满 */
    main {
      flex: 1;
      width: 100%;
      height: 100%;
      padding: 16px 24px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* ============================================================
       视图 1: 3 泳道看板视图 (KANBAN VIEW - 全屏等宽平铺)
       ============================================================ */
    .kanban-container {
      flex: 1;
      width: 100%;
      height: 100%;
      display: flex;
      gap: 20px;
      overflow-x: auto;
      overflow-y: hidden;
      padding-bottom: 4px;
    }

    .kanban-column {
      flex: 1 1 0;
      min-width: 290px;
      background: #ffffff;
      border: 3px solid var(--border);
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      height: 100%;
      border-radius: 8px;
      transition: background 0.15s, border-color 0.15s;
    }
    .kanban-column.drag-over {
      background: #fefce8;
      border-style: dashed;
      box-shadow: var(--shadow-hover);
    }

    .col-header {
      padding: 14px 16px;
      border-bottom: 3px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      user-select: none;
    }
    .col-title {
      font-size: 15px;
      font-weight: 900;
      letter-spacing: -0.3px;
    }
    .col-badge {
      font-family: var(--font-mono);
      font-size: 12px;
      font-weight: 900;
      border: 2px solid var(--border);
      padding: 1px 7px;
      border-radius: 20px;
      background: #ffffff;
    }
    #col-todo .col-header { background: var(--c-yellow); }
    #col-in_progress .col-header { background: var(--c-blue); }
    #col-done .col-header { background: var(--c-green); }

    .col-body {
      flex: 1;
      padding: 14px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* 任务卡片 Card */
    .task-card {
      background: #ffffff;
      border: 2px solid var(--border);
      box-shadow: var(--shadow-sm);
      border-radius: 6px;
      padding: 12px;
      cursor: grab;
      position: relative;
      transition: transform 0.12s, box-shadow 0.12s;
    }
    .task-card:hover {
      transform: translate(-2px, -2px);
      box-shadow: var(--shadow);
    }
    .task-card:active {
      cursor: grabbing;
      transform: translate(2px, 2px);
      box-shadow: var(--shadow-active);
    }
    .task-card.dragging {
      opacity: 0.35;
      transform: scale(0.96);
      border-style: dashed;
    }

    .card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }
    .priority-tag {
      font-family: var(--font-mono);
      font-size: 10px;
      font-weight: 900;
      border: 1.5px solid var(--border);
      padding: 2px 6px;
      text-transform: uppercase;
      border-radius: 3px;
    }
    .priority-2 { background: var(--c-danger); color: #fff; } /* 高 */
    .priority-1 { background: var(--c-yellow); color: #000; } /* 中 */
    .priority-0 { background: #f4f4f5; color: var(--c-text); } /* 低 */

    .card-actions {
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .icon-btn {
      background: #ffffff;
      border: 1.5px solid var(--border);
      box-shadow: 1px 1px 0px #000;
      padding: 3px 6px;
      font-size: 11px;
      font-weight: 800;
      cursor: pointer;
      border-radius: 4px;
      transition: transform 0.08s, box-shadow 0.08s;
    }
    .icon-btn:hover {
      transform: translate(-1px, -1px);
      box-shadow: 2px 2px 0px #000;
    }
    .icon-btn:active {
      transform: translate(1px, 1px);
      box-shadow: none;
    }
    .btn-step-start { background: var(--c-blue); }
    .btn-step-next { background: var(--c-green); }
    .btn-step-reset { background: var(--c-yellow); }

    .card-title {
      font-size: 14px;
      font-weight: 800;
      line-height: 1.4;
      margin-bottom: 5px;
      word-break: break-word;
    }
    .card-title.done {
      text-decoration: line-through;
      color: var(--c-muted);
    }
    .card-desc {
      font-size: 12px;
      color: var(--c-muted);
      line-height: 1.4;
      white-space: pre-wrap;
      word-break: break-word;
      background: #fbfbfe;
      padding: 5px 7px;
      border: 1px solid #e4e4e7;
      border-radius: 4px;
      margin-top: 5px;
    }

    /* ============================================================
       视图 2: 紧凑清单列表视图 (LIST VIEW)
       ============================================================ */
    .list-container {
      flex: 1;
      width: 100%;
      height: 100%;
      background: #ffffff;
      border: 3px solid var(--border);
      box-shadow: var(--shadow);
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .list-header-row {
      display: grid;
      grid-template-columns: 48px 1fr 120px 140px 140px;
      padding: 12px 18px;
      background: var(--c-yellow);
      border-bottom: 3px solid var(--border);
      font-weight: 900;
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      user-select: none;
    }

    .list-scroll-body {
      flex: 1;
      overflow-y: auto;
      padding: 6px 0;
    }

    .list-row {
      display: grid;
      grid-template-columns: 48px 1fr 120px 140px 140px;
      align-items: center;
      padding: 12px 18px;
      border-bottom: 1.5px solid #e4e4e7;
      transition: background 0.12s;
    }
    .list-row:hover { background: #fafaf9; }
    .list-checkbox {
      width: 22px;
      height: 22px;
      border: 2px solid var(--border);
      border-radius: 4px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #ffffff;
      box-shadow: 1px 1px 0px #000;
      font-weight: 900;
      font-size: 14px;
      user-select: none;
    }
    .list-checkbox.checked { background: var(--c-green); }
    .list-row-title {
      font-size: 14px;
      font-weight: 800;
      padding-right: 16px;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .list-row-desc {
      font-size: 12px;
      color: var(--c-muted);
      font-weight: 400;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      padding: 3px 8px;
      border: 1.5px solid var(--border);
      border-radius: 4px;
      font-size: 11px;
      font-weight: 800;
      font-family: var(--font-mono);
      width: fit-content;
    }
    .status-badge.st-todo { background: var(--c-yellow); }
    .status-badge.st-in_progress { background: var(--c-blue); }
    .status-badge.st-done { background: var(--c-green); }

    /* 空状态提示 */
    .empty-placeholder {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      color: var(--c-muted);
      text-align: center;
      gap: 8px;
      font-family: var(--font-mono);
    }
    .empty-icon { font-size: 32px; }

    /* 弹窗 Modal */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
      backdrop-filter: blur(2px);
    }
    .modal-overlay.active { display: flex; }
    .modal-box {
      background: #ffffff;
      border: 3px solid var(--border);
      box-shadow: 8px 8px 0px #000000;
      width: 92%;
      max-width: 480px;
      padding: 24px;
      border-radius: 8px;
      animation: modal-pop 0.15s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    @keyframes modal-pop {
      from { transform: scale(0.92); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 2px solid var(--border);
      padding-bottom: 12px;
      margin-bottom: 16px;
    }
    .modal-header h2 { font-size: 17px; font-weight: 900; }

    .form-group { margin-bottom: 14px; }
    .form-group label {
      display: block;
      font-size: 11px;
      font-weight: 800;
      font-family: var(--font-mono);
      text-transform: uppercase;
      margin-bottom: 5px;
    }
    .form-input {
      width: 100%;
      padding: 8px 12px;
      font-size: 14px;
      font-weight: 600;
      border: 2px solid var(--border);
      box-shadow: var(--shadow-sm);
      outline: none;
      background: #ffffff;
      border-radius: 4px;
    }
    .form-input:focus { box-shadow: var(--shadow); }

    .modal-footer {
      display: flex;
      justify-content: flex-end;
      gap: 12px;
      margin-top: 20px;
      padding-top: 14px;
      border-top: 2px solid #e4e4e7;
    }

    #confetti-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 999;
    }
  </style>
</head>
<body>

  <canvas id="confetti-canvas"></canvas>

  <!-- 顶部导航栏 -->
  <header>
    <div class="header-brand">
      <div class="logo-badge">⚡ RETRO TASK // v2.0</div>
      <!-- 动态实时同步长连接指示器 (点击可配置服务器地址) -->
      <div class="status-pill" id="syncPill" onclick="openServerConfigModal()" title="点击切换/配置服务器地址">
        <span class="status-dot connecting" id="syncDot"></span>
        <span id="syncText">正在建立长连接...</span>
      </div>
    </div>

    <!-- 中部统计仪表盘 (Dashboard) -->
    <div class="dashboard-panel">
      <div class="stat-chip" title="全部任务数">
        <span>ALL:</span>
        <span class="num" id="statAll">0</span>
      </div>
      <div class="stat-chip" style="color: #b45309;" title="待办数">
        <span>TODO:</span>
        <span class="num" id="statTodo">0</span>
      </div>
      <div class="stat-chip" style="color: #0369a1;" title="进行中数">
        <span>PROG:</span>
        <span class="num" id="statProg">0</span>
      </div>
      <div class="stat-chip" style="color: #15803d;" title="已完成数">
        <span>DONE:</span>
        <span class="num" id="statDone">0</span>
      </div>

      <!-- 粗黑框动态进度条 -->
      <div class="progress-bar-wrap">
        <div class="progress-track" title="完成率">
          <div class="progress-fill" id="progressFill"></div>
        </div>
        <div class="progress-pct" id="progressPct">0%</div>
      </div>
    </div>

    <!-- 右侧操作栏 -->
    <div class="header-actions">
      <!-- 即时搜索框 -->
      <div class="search-box">
        <span class="icon">🔍</span>
        <input type="text" id="searchInput" placeholder="检索任务 (/)..." oninput="handleSearch(this.value)" />
      </div>

      <!-- 看板/清单 双视图切换 -->
      <div class="view-toggle-btn">
        <button class="view-opt active" id="btnViewKanban" onclick="switchView('kanban')">🗂️ 看板</button>
        <button class="view-opt" id="btnViewList" onclick="switchView('list')">📋 清单</button>
      </div>

      <!-- 新建任务按钮 -->
      <button class="btn-brutal btn-primary-brutal" onclick="openCreateModal()">+ 新建任务</button>
    </div>
  </header>

  <!-- 主视图容器 -->
  <main>
    <!-- 1. 看板视图 -->
    <div class="kanban-container" id="kanbanView">
      <!-- 待办列 -->
      <div class="kanban-column" id="col-todo"
           ondragover="handleDragOver(event)"
           ondragleave="handleDragLeave(event)"
           ondrop="handleDrop(event, 'todo')">
        <div class="col-header">
          <span class="col-title">📌 待办 (TODO)</span>
          <span class="col-badge" id="count-todo">0</span>
        </div>
        <div class="col-body" id="tasks-todo"></div>
      </div>

      <!-- 进行中列 -->
      <div class="kanban-column" id="col-in_progress"
           ondragover="handleDragOver(event)"
           ondragleave="handleDragLeave(event)"
           ondrop="handleDrop(event, 'in_progress')">
        <div class="col-header">
          <span class="col-title">⚡ 进行中 (IN PROGRESS)</span>
          <span class="col-badge" id="count-in_progress">0</span>
        </div>
        <div class="col-body" id="tasks-in_progress"></div>
      </div>

      <!-- 已完成列 -->
      <div class="kanban-column" id="col-done"
           ondragover="handleDragOver(event)"
           ondragleave="handleDragLeave(event)"
           ondrop="handleDrop(event, 'done')">
        <div class="col-header">
          <span class="col-title">🎉 已完成 (DONE)</span>
          <span class="col-badge" id="count-done">0</span>
        </div>
        <div class="col-body" id="tasks-done"></div>
      </div>
    </div>

    <!-- 2. 清单列表视图 -->
    <div class="list-container" id="listView" style="display: none;">
      <div class="list-header-row">
        <span>完成</span>
        <span>任务事项与备注</span>
        <span>优先级</span>
        <span>当前状态</span>
        <span>快捷操作</span>
      </div>
      <div class="list-scroll-body" id="listBody"></div>
    </div>
  </main>

  <!-- 创建/编辑任务弹窗 -->
  <div class="modal-overlay" id="taskModal">
    <div class="modal-box">
      <div class="modal-header">
        <h2 id="modalTitle">⚡ 新建待办任务</h2>
        <button class="icon-btn" onclick="closeModal()">✕</button>
      </div>
      <form id="taskForm" onsubmit="handleFormSubmit(event)">
        <input type="hidden" id="editTaskId" value="" />
        <div class="form-group">
          <label>任务标题 (Title) *</label>
          <input type="text" id="formTitle" class="form-input" placeholder="输入待办核心事项..." required autofocus />
        </div>
        <div class="form-group">
          <label>备注描述 (Description)</label>
          <textarea id="formDesc" class="form-input" rows="3" placeholder="可选详细背景或验收要求..."></textarea>
        </div>
        <div style="display: flex; gap: 12px;">
          <div class="form-group" style="flex: 1;">
            <label>状态 (Status)</label>
            <select id="formStatus" class="form-input">
              <option value="todo">📌 待办 (TODO)</option>
              <option value="in_progress">⚡ 进行中 (IN PROGRESS)</option>
              <option value="done">🎉 已完成 (DONE)</option>
            </select>
          </div>
          <div class="form-group" style="flex: 1;">
            <label>优先级 (Priority)</label>
            <select id="formPriority" class="form-input">
              <option value="2">🔴 高优 (P1)</option>
              <option value="1" selected>🟡 中优 (P2)</option>
              <option value="0">⚪ 低优 (P3)</option>
            </select>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn-brutal" onclick="closeModal()">取消</button>
          <button type="submit" class="btn-brutal btn-primary-brutal" id="modalSubmitBtn">💾 保存任务</button>
        </div>
      </form>
    </div>
  </div>

  <!-- 服务器配置弹窗 -->
  <div class="modal-overlay" id="serverModal">
    <div class="modal-box">
      <div class="modal-header">
        <h2>☁️ 服务器连接配置</h2>
        <button class="icon-btn" onclick="closeServerModal()">✕</button>
      </div>
      <div class="form-group">
        <label>PocketBase 服务端基准地址</label>
        <input type="text" id="serverInput" class="form-input" placeholder="如: http://47.116.20.106:8090" />
      </div>
      <div style="font-size: 11.5px; color: var(--c-muted); line-height: 1.5; margin-bottom: 16px;">
        • 阿里云公网：<code>http://47.116.20.106:8090</code><br>
        • 本地运行：<code>http://127.0.0.1:8090</code><br>
        • 更改后自动保存并在多端即时建立长连接通道。
      </div>
      <div class="modal-footer">
        <button class="btn-brutal" onclick="closeServerModal()">取消</button>
        <button class="btn-brutal btn-primary-brutal" onclick="saveServerConfig()">💾 连接并保存</button>
      </div>
    </div>
  </div>

  <script>
    // ============================================================
    // 零外部依赖 · 原生高性能实时通信与同步引擎 (Native Realtime Engine)
    // ============================================================
    const DEFAULT_SERVER = window.location.origin.includes('http') ? window.location.origin : 'http://47.116.20.106:8090';
    let API_BASE = localStorage.getItem('pb_server_url') || DEFAULT_SERVER;
    API_BASE = API_BASE.replace(/\/+$/, '');

    let allTodos = [];
    let currentView = 'kanban';
    let searchQuery = '';
    let draggedTaskId = null;
    let eventSource = null;
    let sseClientId = null;
    let isConnected = false;
    let reconnectTimer = null;

    // 状态指示器
    function setSyncStatus(state, text) {
      const dot = document.getElementById('syncDot');
      const txt = document.getElementById('syncText');
      dot.className = 'status-dot ' + state;
      txt.innerText = text;
      isConnected = (state === 'connected');
    }

    // 1. 初始化入口
    async function init() {
      bindKeyboardShortcuts();
      await loadTodos();
      connectRealtimeSSE();
    }

    // 2. 原生 REST 请求封装
    async function apiRequest(endpoint, options = {}) {
      const url = `${API_BASE}/api/${endpoint.replace(/^\/+/, '')}`;
      const headers = {
        'Content-Type': 'application/json',
        ...(options.headers || {})
      };
      const resp = await fetch(url, { ...options, headers });
      if (!resp.ok) {
        let errBody = '';
        try { errBody = await resp.text(); } catch(_) {}
        throw new Error(`API Error [${resp.status}]: ${errBody}`);
      }
      if (resp.status === 204) return null;
      return await resp.json();
    }

    // 3. 拉取全量任务
    async function loadTodos() {
      try {
        const data = await apiRequest('collections/todos/records?sort=order,-created&perPage=500');
        allTodos = data.items || [];
        renderAll();
      } catch (err) {
        console.error('拉取任务失败:', err);
        setSyncStatus('error', '连接服务器失败');
      }
    }

    // 4. 原生 EventSource 建立长连接并订阅 todos
    function connectRealtimeSSE() {
      if (eventSource) {
        eventSource.close();
        eventSource = null;
      }
      clearTimeout(reconnectTimer);
      setSyncStatus('connecting', '正在连接长连接...');

      try {
        const sseUrl = `${API_BASE}/api/realtime`;
        eventSource = new EventSource(sseUrl);

        eventSource.onopen = function() {
          console.log('⚡ SSE 长连接已建立通道');
        };

        eventSource.onmessage = async function(e) {
          try {
            const data = JSON.parse(e.data);

            // 收到 PocketBase 连接包：获取 clientId 并发起主题订阅
            if (data.clientId) {
              sseClientId = data.clientId;
              console.log('✅ 获得 SSE Client ID:', sseClientId);
              await apiRequest('realtime', {
                method: 'POST',
                body: JSON.stringify({
                  clientId: sseClientId,
                  subscriptions: ['todos', 'todos/*']
                })
              });
              setSyncStatus('connected', '实时同步已就绪 (0ms)');
              return;
            }

            // 收到真正的增删改事件！
            if (data.action && data.record) {
              handleIncomingRealtimeEvent(data.action, data.record);
            }
          } catch (err) {
            console.error('解析 SSE 数据异常:', err);
          }
        };

        eventSource.onerror = function(err) {
          console.warn('⚠️ SSE 连接断开，将在 3 秒后自动重连...', err);
          setSyncStatus('error', '连接已断开，重连中...');
          eventSource.close();
          eventSource = null;
          reconnectTimer = setTimeout(connectRealtimeSSE, 3000);
        };
      } catch (e) {
        console.error('初始化 EventSource 失败:', e);
        setSyncStatus('error', '连接异常');
        reconnectTimer = setTimeout(connectRealtimeSSE, 3000);
      }
    }

    // 5. 收到远端推送的事件处理（核心双向实时保证）
    function handleIncomingRealtimeEvent(action, record) {
      console.log(`🔔 收到多端实时广播 [${action}]:`, record.title);

      if (action === 'create') {
        if (!allTodos.some(t => t.id === record.id)) {
          allTodos.push(record);
        }
      } else if (action === 'update') {
        const idx = allTodos.findIndex(t => t.id === record.id);
        if (idx !== -1) {
          allTodos[idx] = record;
        } else {
          allTodos.push(record);
        }
      } else if (action === 'delete') {
        allTodos = allTodos.filter(t => t.id !== record.id);
      }
      renderAll();
    }

    // 统一渲染调度
    function renderAll() {
      updateDashboard();
      if (currentView === 'kanban') {
        renderKanban();
      } else {
        renderList();
      }
    }

    // 统计面板与完成率进度条更新
    function updateDashboard() {
      const total = allTodos.length;
      const todoCount = allTodos.filter(t => (t.status || 'todo') === 'todo').length;
      const progCount = allTodos.filter(t => t.status === 'in_progress').length;
      const doneCount = allTodos.filter(t => t.status === 'done').length;

      document.getElementById('statAll').innerText = total;
      document.getElementById('statTodo').innerText = todoCount;
      document.getElementById('statProg').innerText = progCount;
      document.getElementById('statDone').innerText = doneCount;

      const pct = total === 0 ? 0 : Math.round((doneCount / total) * 100);
      document.getElementById('progressFill').style.width = pct + '%';
      document.getElementById('progressPct').innerText = pct + '%';
    }

    // 过滤检索
    function getFilteredTodos() {
      if (!searchQuery.trim()) return allTodos;
      const q = searchQuery.toLowerCase();
      return allTodos.filter(t =>
        (t.title && t.title.toLowerCase().includes(q)) ||
        (t.description && t.description.toLowerCase().includes(q))
      );
    }

    // 渲染看板视图
    function renderKanban() {
      const filtered = getFilteredTodos();
      const statuses = ['todo', 'in_progress', 'done'];
      const counts = { todo: 0, in_progress: 0, done: 0 };

      statuses.forEach(st => {
        const body = document.getElementById(`tasks-${st}`);
        body.innerHTML = '';
      });

      filtered.forEach(item => {
        const st = item.status || 'todo';
        counts[st] = (counts[st] || 0) + 1;
        const body = document.getElementById(`tasks-${st}`);
        if (!body) return;

        const card = createKanbanCard(item);
        body.appendChild(card);
      });

      statuses.forEach(st => {
        document.getElementById(`count-${st}`).innerText = counts[st];
        const body = document.getElementById(`tasks-${st}`);
        if (counts[st] === 0) {
          body.innerHTML = `
            <div class="empty-placeholder">
              <span class="empty-icon">${st === 'done' ? '🎯' : '📦'}</span>
              <span>暂无此状态任务</span>
            </div>
          `;
        }
      });
    }

    // 创建看板卡片元素
    function createKanbanCard(item) {
      const card = document.createElement('div');
      card.className = 'task-card';
      card.draggable = true;
      card.id = `card-${item.id}`;

      const pVal = item.priority ?? 1;
      const pText = pVal === 2 ? 'P1 高优' : (pVal === 1 ? 'P2 中优' : 'P3 低优');
      const isDone = item.status === 'done';

      let stepBtn = '';
      if (item.status === 'todo') {
        stepBtn = `<button class="icon-btn btn-step-start" onclick="updateTaskStatus('${item.id}', 'in_progress')" title="推进到进行中">▶ 开始</button>`;
      } else if (item.status === 'in_progress') {
        stepBtn = `<button class="icon-btn btn-step-next" onclick="markTaskDone('${item.id}')" title="标记完成">✓ 搞定</button>`;
      } else {
        stepBtn = `<button class="icon-btn btn-step-reset" onclick="updateTaskStatus('${item.id}', 'todo')" title="重新开启">↺ 重开</button>`;
      }

      card.innerHTML = `
        <div class="card-top">
          <span class="priority-tag priority-${pVal}">${pText}</span>
          <div class="card-actions">
            ${stepBtn}
            <button class="icon-btn" onclick="openEditModal('${item.id}')" title="编辑任务">✎</button>
            <button class="icon-btn" onclick="deleteTask('${item.id}')" title="删除">✕</button>
          </div>
        </div>
        <div class="card-title ${isDone ? 'done' : ''}">${escapeHtml(item.title)}</div>
        ${item.description ? `<div class="card-desc">${escapeHtml(item.description)}</div>` : ''}
      `;

      card.addEventListener('dragstart', (e) => {
        draggedTaskId = item.id;
        card.classList.add('dragging');
        e.dataTransfer.setData('text/plain', item.id);
      });
      card.addEventListener('dragend', () => {
        card.classList.remove('dragging');
        draggedTaskId = null;
      });

      return card;
    }

    // 渲染清单列表视图
    function renderList() {
      const filtered = getFilteredTodos();
      const listBody = document.getElementById('listBody');
      listBody.innerHTML = '';

      if (filtered.length === 0) {
        listBody.innerHTML = `
          <div class="empty-placeholder" style="padding: 60px;">
            <span class="empty-icon">📂</span>
            <span>没有匹配的清单事项</span>
          </div>
        `;
        return;
      }

      filtered.forEach(item => {
        const row = document.createElement('div');
        row.className = 'list-row';
        const isDone = item.status === 'done';
        const pVal = item.priority ?? 1;
        const pText = pVal === 2 ? 'P1 高优' : (pVal === 1 ? 'P2 中优' : 'P3 低优');

        let stText = '📌 待办';
        let stClass = 'st-todo';
        if (item.status === 'in_progress') {
          stText = '⚡ 进行中';
          stClass = 'st-in_progress';
        } else if (item.status === 'done') {
          stText = '🎉 已完成';
          stClass = 'st-done';
        }

        row.innerHTML = `
          <div>
            <div class="list-checkbox ${isDone ? 'checked' : ''}" onclick="toggleDoneStatus('${item.id}')">
              ${isDone ? '✓' : ''}
            </div>
          </div>
          <div class="list-row-title">
            <span style="${isDone ? 'text-decoration: line-through; color: var(--c-muted);' : ''}">${escapeHtml(item.title)}</span>
            ${item.description ? `<span class="list-row-desc">${escapeHtml(item.description)}</span>` : ''}
          </div>
          <div>
            <span class="priority-tag priority-${pVal}">${pText}</span>
          </div>
          <div>
            <span class="status-badge ${stClass}">${stText}</span>
          </div>
          <div style="display: flex; gap: 6px;">
            <button class="icon-btn" onclick="openEditModal('${item.id}')">编辑</button>
            <button class="icon-btn" onclick="deleteTask('${item.id}')">删除</button>
          </div>
        `;
        listBody.appendChild(row);
      });
    }

    function switchView(view) {
      currentView = view;
      document.getElementById('btnViewKanban').classList.toggle('active', view === 'kanban');
      document.getElementById('btnViewList').classList.toggle('active', view === 'list');
      document.getElementById('kanbanView').style.display = view === 'kanban' ? 'flex' : 'none';
      document.getElementById('listView').style.display = view === 'list' ? 'flex' : 'none';
      renderAll();
    }

    function handleSearch(val) {
      searchQuery = val;
      renderAll();
    }

    function handleDragOver(e) {
      e.preventDefault();
      e.currentTarget.classList.add('drag-over');
    }
    function handleDragLeave(e) {
      e.currentTarget.classList.remove('drag-over');
    }
    async function handleDrop(e, targetStatus) {
      e.preventDefault();
      e.currentTarget.classList.remove('drag-over');
      const id = e.dataTransfer.getData('text/plain') || draggedTaskId;
      if (!id) return;

      const item = allTodos.find(t => t.id === id);
      if (item && item.status !== targetStatus) {
        if (targetStatus === 'done') triggerConfetti();
        // 乐观更新
        item.status = targetStatus;
        renderAll();
        try {
          await apiRequest(`collections/todos/records/${id}`, {
            method: 'PATCH',
            body: JSON.stringify({ status: targetStatus })
          });
        } catch (err) {
          console.error('更新状态失败:', err);
          loadTodos();
        }
      }
    }

    async function updateTaskStatus(id, newStatus) {
      const item = allTodos.find(t => t.id === id);
      if (!item) return;
      item.status = newStatus;
      renderAll();
      try {
        await apiRequest(`collections/todos/records/${id}`, {
          method: 'PATCH',
          body: JSON.stringify({ status: newStatus })
        });
      } catch (err) {
        loadTodos();
      }
    }

    async function markTaskDone(id) {
      triggerConfetti();
      await updateTaskStatus(id, 'done');
    }

    async function toggleDoneStatus(id) {
      const item = allTodos.find(t => t.id === id);
      if (!item) return;
      const newStatus = item.status === 'done' ? 'todo' : 'done';
      if (newStatus === 'done') triggerConfetti();
      await updateTaskStatus(id, newStatus);
    }

    async function deleteTask(id) {
      if (!confirm('💥 确定要永久删除该项任务吗？')) return;
      allTodos = allTodos.filter(t => t.id !== id);
      renderAll();
      try {
        await apiRequest(`collections/todos/records/${id}`, { method: 'DELETE' });
      } catch (err) {
        loadTodos();
      }
    }

    // 弹窗控制
    function openCreateModal() {
      document.getElementById('modalTitle').innerText = '⚡ 新建待办任务';
      document.getElementById('modalSubmitBtn').innerText = '💾 保存任务';
      document.getElementById('editTaskId').value = '';
      document.getElementById('formTitle').value = '';
      document.getElementById('formDesc').value = '';
      document.getElementById('formStatus').value = 'todo';
      document.getElementById('formPriority').value = '1';
      document.getElementById('taskModal').classList.add('active');
      setTimeout(() => document.getElementById('formTitle').focus(), 50);
    }

    function openEditModal(id) {
      const item = allTodos.find(t => t.id === id);
      if (!item) return;
      document.getElementById('modalTitle').innerText = '✎ 编辑任务详情';
      document.getElementById('modalSubmitBtn').innerText = '💾 更新任务';
      document.getElementById('editTaskId').value = item.id;
      document.getElementById('formTitle').value = item.title || '';
      document.getElementById('formDesc').value = item.description || '';
      document.getElementById('formStatus').value = item.status || 'todo';
      document.getElementById('formPriority').value = item.priority ?? 1;
      document.getElementById('taskModal').classList.add('active');
      setTimeout(() => document.getElementById('formTitle').focus(), 50);
    }

    function closeModal() {
      document.getElementById('taskModal').classList.remove('active');
    }

    async function handleFormSubmit(e) {
      e.preventDefault();
      const id = document.getElementById('editTaskId').value;
      const title = document.getElementById('formTitle').value.trim();
      const description = document.getElementById('formDesc').value.trim();
      const status = document.getElementById('formStatus').value;
      const priority = parseInt(document.getElementById('formPriority').value, 10);

      if (!title) return;
      closeModal();

      if (id) {
        const item = allTodos.find(t => t.id === id);
        if (item) {
          item.title = title;
          item.description = description;
          item.status = status;
          item.priority = priority;
          renderAll();
        }
        try {
          await apiRequest(`collections/todos/records/${id}`, {
            method: 'PATCH',
            body: JSON.stringify({ title, description, status, priority })
          });
        } catch (err) {
          alert('保存失败: ' + err.message);
          loadTodos();
        }
      } else {
        try {
          const record = await apiRequest('collections/todos/records', {
            method: 'POST',
            body: JSON.stringify({
              title,
              description,
              status,
              priority,
              order: Date.now()
            })
          });
          if (!allTodos.some(t => t.id === record.id)) {
            allTodos.push(record);
            renderAll();
          }
        } catch (err) {
          alert('创建失败: ' + err.message);
        }
      }
    }

    // 服务器地址配置
    function openServerConfigModal() {
      document.getElementById('serverInput').value = API_BASE;
      document.getElementById('serverModal').classList.add('active');
    }
    function closeServerModal() {
      document.getElementById('serverModal').classList.remove('active');
    }
    async function saveServerConfig() {
      const val = document.getElementById('serverInput').value.trim().replace(/\/+$/, '');
      if (!val) return;
      API_BASE = val;
      localStorage.setItem('pb_server_url', API_BASE);
      closeServerModal();
      await loadTodos();
      connectRealtimeSSE();
    }

    function bindKeyboardShortcuts() {
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') {
          closeModal();
          closeServerModal();
        }
        if (e.key === '/' && document.activeElement.tagName !== 'INPUT' && document.activeElement.tagName !== 'TEXTAREA') {
          e.preventDefault();
          document.getElementById('searchInput').focus();
        }
      });
    }

    function triggerConfetti() {
      const canvas = document.getElementById('confetti-canvas');
      const ctx = canvas.getContext('2d');
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      const particles = [];
      const colors = ['#fef08a', '#bae6fd', '#bbf7d0', '#fbcfe8', '#f87171', '#000000'];

      for (let i = 0; i < 60; i++) {
        particles.push({
          x: canvas.width / 2 + (Math.random() - 0.5) * 300,
          y: canvas.height / 2 + (Math.random() - 0.5) * 100,
          vx: (Math.random() - 0.5) * 12,
          vy: (Math.random() - 1.2) * 10,
          size: Math.random() * 8 + 5,
          color: colors[Math.floor(Math.random() * colors.length)],
          rotation: Math.random() * 360,
          vRot: (Math.random() - 0.5) * 10
        });
      }

      let frame = 0;
      function animate() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        let alive = false;
        particles.forEach(p => {
          p.x += p.vx;
          p.y += p.vy;
          p.vy += 0.35;
          p.rotation += p.vRot;

          if (p.y < canvas.height) {
            alive = true;
            ctx.save();
            ctx.translate(p.x, p.y);
            ctx.rotate((p.rotation * Math.PI) / 180);
            ctx.fillStyle = p.color;
            ctx.strokeStyle = '#000000';
            ctx.lineWidth = 1.5;
            ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
            ctx.strokeRect(-p.size / 2, -p.size / 2, p.size, p.size);
            ctx.restore();
          }
        });

        frame++;
        if (alive && frame < 120) {
          requestAnimationFrame(animate);
        } else {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
        }
      }
      requestAnimationFrame(animate);
    }

    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/[&<>'"]/g, tag => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
      }[tag] || tag));
    }

    init();
  </script>
</body>
</html>
